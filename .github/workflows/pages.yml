name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 首次网页上传使用压缩包运输源码；展开后提交普通文件，并移除运输包。
      # 工作流文件通过 GitHub 网页单独维护，避免自动写入工作流权限。
      - name: Import packaged source on first publish
        if: hashFiles('shigang-source.zip') != ''
        run: |
          echo '265b9ddc6428dc733fcddabcbcd317eea8ff1f6be60a24607fdab60855125cee  shigang-source.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shigang-source"
          unzip -q shigang-source.zip -d "$RUNNER_TEMP/shigang-source"
          rsync -a --exclude='.github/' "$RUNNER_TEMP/shigang-source/" ./
          rm shigang-source.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- . ':!.github'
          git commit -m "Import complete SHIXU source and documentation"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - name: Prepare public files only
        run: |
          mkdir _site
          cp index.html sw.js _site/
          cp -r css js data assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
